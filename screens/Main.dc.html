<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.agf-illus{background-image:linear-gradient(rgba(89, 108, 52, 0.55) 0%, rgba(89, 108, 52, 0.7) 60%, rgba(89, 108, 52, 0.8) 100%),url(img/6caf4b71a0cc0fdbdb0a814ba097dfad.png)}
@keyframes agf-drift{from{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes agf-rise{from{opacity:0;transform:translateY(18px);font-weight:300}}
@keyframes agf-fade{from{opacity:0;transform:translateY(6px)}}
@keyframes agf-nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.agf-bg{animation:agf-drift 6s cubic-bezier(.2,.6,.2,1) both}
.agf-w{animation:agf-rise .7s cubic-bezier(.2,.7,.2,1) both}
.agf-w1{animation-delay:.15s}.agf-w2{animation-delay:.27s}.agf-w3{animation-delay:.39s}
.agf-tag{animation:agf-fade .6s ease-out .85s both}
.agf-hint{animation:agf-fade .5s ease-out 1.2s both}
.agf-arrow{animation:agf-nudge 1.6s ease-in-out 1.8s infinite}
.agf-mark{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.agf-mark.is-open{transform:translateY(-230px)}
.agf-hintwrap{transition:opacity .25s ease-out}
.agf-hintwrap.is-open{opacity:0;pointer-events:none}
.agf-scrim{opacity:0;pointer-events:none;transition:opacity .35s ease-out}
.agf-scrim.is-open{opacity:1;pointer-events:auto}
.agf-sheet{transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.agf-sheet.is-open{transform:translateY(0)}
.agf-btn:active{transform:scale(.98)}
@media (prefers-reduced-motion: reduce){.agf-bg,.agf-w,.agf-tag,.agf-hint,.agf-arrow{animation:none}.agf-mark,.agf-hintwrap,.agf-scrim,.agf-sheet{transition:none}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"wordmarkFont": {"editor": "enum", "options": ["Playfair Display", "Fraunces", "DM Serif Display", "Instrument Serif", "Bricolage Grotesque", "Archivo", "Syne", "Outfit"], "default": "Fraunces", "section": "Wordmark"}, "showSheet": {"editor": "boolean", "default": false, "section": "States"}, "$preview": {"width": 402, "height": 874}}'>
const FONTS = {
'Playfair Display': ["'Playfair Display', Georgia, serif", 700, '-0.01em'],
'Fraunces': ["'Fraunces', Georgia, serif", 700, '-0.02em'],
'DM Serif Display': ["'DM Serif Display', Georgia, serif", 400, '-0.01em'],
'Instrument Serif': ["'Instrument Serif', Georgia, serif", 400, '-0.01em'],
'Bricolage Grotesque': ["'Bricolage Grotesque', system-ui, sans-serif", 800, '-0.03em'],
'Archivo': ["'Archivo', system-ui, sans-serif", 800, '-0.03em'],
'Syne': ["'Syne', system-ui, sans-serif", 800, '-0.02em'],
'Outfit': ["'Outfit', system-ui, sans-serif", 700, '-0.03em']
};
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: null };
}
renderVals() {
const f = FONTS[this.props.wordmarkFont ?? 'Fraunces'] || FONTS['Fraunces'];
const open = this.state.open === null ? !!this.props.showSheet : this.state.open;
return {
wmFamily: f[0], wmWeight: f[1], wmTracking: f[2],
openClass: open ? 'is-open' : '',
homeBar: open ? 'rgba(49, 57, 27, 0.35)' : 'rgba(255, 255, 255, 0.6)',
openSheet: () => this.setState({ open: true }),
closeSheet: () => this.setState({ open: false })
};
}
}
</script>
