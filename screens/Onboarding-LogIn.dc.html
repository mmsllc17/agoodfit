<div style="position: absolute; inset: 0; padding: 58px 28px 40px; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 12px; margin-left: -10px;">

<h1 style="margin: 20px 0px 0px; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 700; font-size: 32px; line-height: 1.1; letter-spacing: -0.01em; color: #6B7F3C;">Welcome back</h1>
<p style="margin: 6px 0px 0px; font-size: 14px; color: #6E6A5C;">Your crew missed you.</p>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 22px;">
<a href="Core-Feed.dc.html" style="width: 100%; height: 50px; border-radius: 12px; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Continue with Apple</a>
<a href="Core-Feed.dc.html" style="width: 100%; height: 50px; border-radius: 12px; border: 1px solid #D9D4C8; background: #FFFFFF; color: #31391B; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Continue with Google</a>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; margin: 18px 0px; font-size: 13px; color: #7E7969;"><div style="flex: 1 1 0%; height: 1px; background: #E2DDD1;"></div><span>or log in with email</span><div style="flex: 1 1 0%; height: 1px; background: #E2DDD1;"></div></div>
<div style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="agf-email" style="font-size: 13px; font-weight: 600; color: #31391B;">Email</label>
<input id="agf-email" class="agf-field" type="email" autocomplete="email" placeholder="you@example.com" value="{{email}}" onChange="{{onEmail}}" style="width: 100%; height: 50px; padding: 0px 16px; border-radius: 12px; border: 1px solid #D9D4C8; background: #FFFFFF; font-size: 16px; color: #31391B; outline: none;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="agf-pw" style="font-size: 13px; font-weight: 600; color: #31391B;">Password</label>
<div style="position: relative;">
<input id="agf-pw" class="agf-field" type="{{pwType}}" autocomplete="current-password" value="{{pw}}" onChange="{{onPw}}" style="width: 100%; height: 50px; padding: 0px 52px 0px 16px; border-radius: 12px; border: 1px solid #D9D4C8; background: #FFFFFF; font-size: 16px; color: #31391B; outline: none;">
<button type="button" onClick="{{togglePw}}" aria-label="{{pwToggleLabel}}" style="position: absolute; top: 3px; right: 3px; width: 44px; height: 44px; border: none; background: transparent; color: #7E7969; display: flex; align-items: center; justify-content: center; cursor: pointer;">
<sc-if value="{{pwShown}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1"></path><path d="M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></sc-if>
<sc-if value="{{pwHidden}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
</button>
</div>
<div style="display: flex; justify-content: flex-end;"><button type="button" onClick="{{forgot}}" style="height: 44px; padding: 0px 2px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #4E5E2B; cursor: pointer;">Forgot password?</button></div>
<sc-if value="{{resetSent}}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; gap: 10px; align-items: flex-start; background: #EEF2E2; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; color: #4E5E2B;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5E2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect><path d="M4 7l8 6 8-6"></path></svg><span>{{resetMsg}}</span></div></sc-if>
</div>
</div>
<div style="flex: 1 1 0%;"></div>
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
<a href="Core-Feed.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: 12px; background: #6B7F3C; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none;">Log in</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
<button type="button" disabled="" style="width: 100%; height: 52px; border-radius: 12px; border: none; background: #DDE3CB; color: #5F6B3E; font-size: 16px; font-weight: 600; cursor: default;">Log in</button>
</sc-if>
<p style="margin: 16px 0px 0px; font-size: 14px; color: #31391B; text-align: center;">New to A Good Fit? <a href="Onboarding-CreateAccount.dc.html" style="font-weight: 600;">Sign up</a></p>
</div>
<div style="position: absolute; bottom: 0px; left: 0px; right: 0px; z-index: 60; height: 34px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 8px; pointer-events: none;"><div style="width: 139px; height: 5px; border-radius: 100px; background: rgba(0, 0, 0, 0.25);"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { email: '', pw: '', show: false, reset: false };
}
renderVals() {
const s = this.state;
const emailOk = /.+@.+\..+/.test(s.email);
const ready = emailOk && s.pw.length > 0;
return {
email: s.email, pw: s.pw,
forgot: () => this.setState({ reset: true }), resetSent: s.reset, resetMsg: emailOk ? 'Check ' + s.email + ' for a reset link.' : 'Enter your email above and we\u2019ll send a reset link.',
onEmail: (e) => this.setState({ email: e.target.value }),
onPw: (e) => this.setState({ pw: e.target.value }),
pwType: s.show ? 'text' : 'password',
pwShown: s.show, pwHidden: !s.show,
pwToggleLabel: s.show ? 'Hide password' : 'Show password',
togglePw: () => this.setState({ show: !s.show }),
ready: ready, notReady: !ready
};
}
}
</script>
