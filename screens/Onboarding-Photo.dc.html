class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: null, photo: null };
}
renderVals() {
const open = this.state.open === null ? !!this.props.showSheet : this.state.open;
const photo = this.state.photo === null ? !!this.props.showPhoto : this.state.photo;
return {
openClass: open ? 'is-open' : '',
hasPhoto: photo, noPhoto: !photo,
circleLabel: photo ? 'Change profile photo' : 'Add profile photo',
openSheet: () => this.setState({ open: true }),
closeSheet: () => this.setState({ open: false }),
pickPhoto: () => this.setState({ open: false, photo: true }),
removePhoto: () => this.setState({ open: false, photo: false })
};
}
