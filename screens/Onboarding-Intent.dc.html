<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { community: false, fitness: false, romantic: false };
}
renderVals() {
const s = this.state;
const allOn = s.community && s.fitness && s.romantic;
const look = (on, toggle) => ({
on: on ? 'true' : 'false',
pick: toggle,
border: on ? '#6B7F3C' : '#E2DDD1',
bg: on ? '#F7F9F1' : '#FFFFFF',
ring: on ? '#6B7F3C' : '#CFC9BA',
dot: on ? '#6B7F3C' : 'transparent',
check: on ? '#FFFFFF' : 'transparent'
});
const flip = (k) => () => this.setState({ [k]: !s[k] });
const any = s.community || s.fitness || s.romantic;
return {
community: look(s.community, flip('community')),
fitness: look(s.fitness, flip('fitness')),
romantic: look(s.romantic, flip('romantic')),
all: look(allOn, () => this.setState({ community: !allOn, fitness: !allOn, romantic: !allOn })),
ready: any, notReady: !any
};
}
}
