<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { running: false, cycling: false, strength: false, yoga: false, hiking: false, pilates: false, hiit: false, crossfit: false, more: false };
}
renderVals() {
const s = this.state;
const keys = ['running', 'cycling', 'strength', 'yoga', 'hiking', 'pilates', 'hiit', 'crossfit'];
const count = keys.filter((k) => s[k]).length;
const full = count >= 3;
const look = (k) => {
const on = s[k];
const blocked = full && !on;
return {
on: on ? 'true' : 'false',
off: blocked ? 'true' : 'false',
op: blocked ? '0.45' : '1',
pick: () => { if (!blocked) this.setState({ [k]: !on }); },
border: on ? '#6B7F3C' : '#E2DDD1',
bg: on ? '#F7F9F1' : '#FFFFFF',
ring: on ? '#6B7F3C' : '#CFC9BA',
dot: on ? '#6B7F3C' : 'transparent',
check: on ? '#FFFFFF' : 'transparent'
};
};
const out = {
moreShown: s.more, moreHidden: !s.more,
showMore: () => this.setState({ more: true }),
ready: count >= 1, notReady: count === 0,
remainingLabel: 'Pick 1 to continue'
};
keys.forEach((k) => { out[k] = look(k); });
return out;
}
}
</script>
