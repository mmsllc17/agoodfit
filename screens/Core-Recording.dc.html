<script type="text/x-dc" data-dc-script data-props='{"showPaused":{"editor":"boolean","default":false,"section":"States"},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { paused: null };
}
renderVals() {
const paused = this.state.paused === null ? !!this.props.showPaused : this.state.paused;
return {
running: !paused, paused: paused,
pause: () => this.setState({ paused: true }),
resume: () => this.setState({ paused: false }),
pill: paused ? { bg: '#6E6A5C', label: 'PAUSED', dotClass: '' } : { bg: '#C84B3C', label: 'RECORDING', dotClass: 'agf-blink' }
};
}
}
</script>
